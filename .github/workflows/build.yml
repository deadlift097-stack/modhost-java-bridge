name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK pieces
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0" "platforms;android-35"
      - run: ./scripts/build-java.sh
      - uses: actions/upload-artifact@v4
        with: { name: java-dex, path: build/java }

  native:
    needs: java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: java-dex, path: build/java }
      - name: NDK + CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
          sudo apt-get install -y ninja-build
      - name: Build .levipack
        shell: pwsh
        run: ./scripts/package.ps1 -Abi arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: levipack
          path: |
            **/*.levipack
            build/java/mods/*
